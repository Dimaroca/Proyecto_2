<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante - Trophinder</title>
    <link rel="stylesheet" href="../css/restaurant.css">
</head>
<body>

<header>
    <h1>Trophinder</h1>
</header>

<main>

```
<div class="restaurant-box">

    <div class="restaurant-info">

        <h2 id="restaurantName">
            Cargando...
        </h2>

        <p
            class="rating"
            id="restaurantRating">
        </p>

        <div class="details">

            <p>
                <strong>Categoría:</strong>
                <span id="restaurantCategory">
                    Cargando...
                </span>
            </p>

            <p>
                <strong>Ciudad:</strong>
                <span id="restaurantCity">
                    Cargando...
                </span>
            </p>

            <p>
                <strong>Zona:</strong>
                <span id="restaurantZone">
                    Cargando...
                </span>
            </p>

            <p>
                <strong>Ambiente:</strong>
                <span id="restaurantEnvironment">
                    Cargando...
                </span>
            </p>

            <p>
                <strong>Descripción:</strong>
                <span id="restaurantDescription">
                    Cargando...
                </span>
            </p>

        </div>

        <div class="buttons">

            <a
                id="backBtn"
                class="btn">

                Regresar

            </a>

            <a
                id="reviewBtn"
                class="btn">

                Calificar restaurante

            </a>

        </div>

    </div>

</div>
```

</main>

<script src="../js/restaurant.js"></script>

</body>
</html>
