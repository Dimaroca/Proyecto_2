<!DOCTYPE html>

<html lang="es">
<head>
    <!-- Configuración de caracteres para soportar acentos y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Permite que la página se adapte correctamente a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icono que aparece en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="../assets/logo.png">

    <!-- Título de la página -->
    <title>Restaurant - Throphinder</title>

    <!-- Hoja de estilos de la página del restaurante -->
    <link rel="stylesheet" href="../css/restaurant.css">
</head>
<body>

<header>

    <!-- Contenedor del logo o nombre de la aplicación -->
    <div class="nombre-container">
        <img src="../assets/nombre.png" alt="ThropFinder">
    </div>

    <!-- Contenedor de acciones del encabezado -->
    <div class="header-actions">

        <!-- Botón para cerrar sesión -->
        <button id="logoutBtn" class="logout-btn">
            Cerrar sesión
        </button>

    </div>

</header>

<main>

    <!-- Contenedor principal de la información del restaurante -->
    <div class="restaurant-box">

        <!-- Sección con los datos del restaurante -->
        <div class="restaurant-info">

            <!-- Nombre del restaurante cargado dinámicamente -->
            <h2 id="restaurantName">
                Cargando...
            </h2>

            <!-- Calificación del restaurante -->
            <p
                class="rating"
                id="restaurantRating">
            </p>

            <!-- Información detallada del restaurante -->
            <div class="details">

                <!-- Categoría del restaurante -->
                <p>
                    <strong>Categoría:</strong>
                    <span id="restaurantCategory">
                        Cargando...
                    </span>
                </p>

                <!-- Ciudad donde se encuentra -->
                <p>
                    <strong>Ciudad:</strong>
                    <span id="restaurantCity">
                        Cargando...
                    </span>
                </p>

                <!-- Zona o ubicación específica -->
                <p>
                    <strong>Zona:</strong>
                    <span id="restaurantZone">
                        Cargando...
                    </span>
                </p>

            </div>

            <!-- Contenedor de botones de acción -->
            <div class="buttons">

                <!-- Botón para regresar a la página anterior -->
                <a
                    id="backBtn"
                    class="btn">

                    Regresar

                </a>

                <!-- Botón para calificar el restaurante -->
                <a
                    id="reviewBtn"
                    class="btn">

                    Calificar restaurante

                </a>

            </div>

        </div>

    </div>

</main>

<!-- Archivo JavaScript encargado de cargar y gestionar la información del restaurante -->
<script src="../js/restaurant.js"></script>

</body>
</html>
