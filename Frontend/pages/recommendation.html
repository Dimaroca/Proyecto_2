<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <title>Reccommendations - Throphinder</title>
    <link rel="stylesheet" href="../css/recommendation.css">
</head>
<body>

<header>
    <div class="nombre-container">
        <img src="../assets/nombre.png" alt="ThropFinder">
    </div>

    <div class="header-actions">

        <button id="logoutBtn" class="logout-btn">
            Cerrar sesión
        </button>

    </div>
</header>

<main>

<section class="section">

    <h2>Recomendados para ti</h2>

    <div class="slider-container">

        <button
            class="arrow left"
            data-slider="recommendedSlider"
            data-direction="-300">

            &#10094;

        </button>

        <div
            class="slider"
            id="recommendedSlider">
        </div>

        <button
            class="arrow right"
            data-slider="recommendedSlider"
            data-direction="300">

            &#10095;

        </button>

    </div>

</section>

</main>

<script src="../js/recommendation.js"></script>

</body>
</html>
