<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar Restaurante</title>
    <link rel="stylesheet" href="../css/review.css">
</head>
<body>

<header>
    <h1>Trophinder</h1>
</header>

<main>

```
<div class="review-box">

    <h2>Califica tu experiencia</h2>

    <h3 id="restaurantName">
        Cargando restaurante...
    </h3>

    <form id="reviewForm">

        <label for="rating">
            Calificación
        </label>

        <select
            id="rating"
            required>

            <option value="">
                Selecciona una calificación
            </option>

            <option value="1">
                ⭐ 1
            </option>

            <option value="2">
                ⭐⭐ 2
            </option>

            <option value="3">
                ⭐⭐⭐ 3
            </option>

            <option value="4">
                ⭐⭐⭐⭐ 4
            </option>

            <option value="5">
                ⭐⭐⭐⭐⭐ 5
            </option>

        </select>

        <label for="comment">
            Comentario
        </label>

        <textarea
            id="comment"
            rows="6"
            placeholder="Describe tu experiencia">
        </textarea>

        <button type="submit">
            Enviar reseña
        </button>

    </form>

</div>
```

</main>

<script src="../js/review.js"></script>

</body>
</html>
