<!DOCTYPE html>

<html lang="es">
<head>
    <!-- Configuración de caracteres para soportar acentos y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Permite que la página se adapte correctamente a diferentes dispositivos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icono mostrado en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="../assets/logo.png">

    <!-- Título de la página -->
    <title>Rate - Throphinder</title>

    <!-- Hoja de estilos de la página de reseñas -->
    <link rel="stylesheet" href="../css/review.css">
</head>
<body>

<header>

    <!-- Contenedor del logo o nombre de la aplicación -->
    <div class="nombre-container">
        <img src="../assets/nombre.png" alt="ThropFinder">
    </div>

    <!-- Contenedor de acciones del encabezado -->
    <div class="header-actions">

        <!-- Botón para cerrar sesión -->
        <button id="logoutBtn" class="logout-btn">
            Cerrar sesión
        </button>

    </div>

</header>

<main>

    <!-- Contenedor principal de la reseña -->
    <div class="review-box">

        <!-- Título principal -->
        <h2>
            Califica tu experiencia
        </h2>

        <!-- Nombre del restaurante cargado dinámicamente -->
        <h3 id="restaurantName">
            Cargando restaurante...
        </h3>

        <!-- Formulario para enviar la reseña -->
        <form id="reviewForm">

            <!-- Etiqueta para la calificación -->
            <label>
                Calificación
            </label>

            <!-- Sistema de estrellas para seleccionar la puntuación -->
            <div class="star-rating">

                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>

            </div>

            <!-- Campo oculto donde se almacena la calificación seleccionada -->
            <input
                type="hidden"
                id="rating"
                value="">

            <!-- Etiqueta para el comentario -->
            <label for="comment">
                Comentario
            </label>

            <!-- Área de texto para escribir la reseña -->
            <textarea
                id="comment"
                rows="6"
                placeholder="Describe tu experiencia">
            </textarea>

            <!-- Botón para enviar la reseña -->
            <button type="submit">
                Enviar reseña
            </button>

        </form>

    </div>

</main>

<!-- Archivo JavaScript encargado de gestionar las reseñas -->
<script src="../js/review.js"></script>

</body>
</html>
