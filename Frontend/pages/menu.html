<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <title>Menu - Throphinder</title>
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

<header>

    <div class="nombre-container">
        <img src="../assets/nombre.png" alt="ThropFinder">
    </div>

    <div class="header-actions">

        <button id="logoutBtn" class="logout-btn">
            Cerrar sesión
        </button>

    </div>

</header>

<main>

    <section class="hero">

        <div class="hero-content">

            <h1>
                Descubre tu próximo restaurante favorito
            </h1>

            <p>
                Explora restaurantes, descubre nuevos lugares y encuentra experiencias gastronómicas únicas.
            </p>

            <button class="recommend-btn">
                Buscar recomendaciones
            </button>

        </div>

    </section>

    <section class="section">

        <h2>
            Top 10 restaurantes mejor calificados
        </h2>

        <div class="slider-container">

            <button class="arrow left" id="prevBtn">
                &#10094;
            </button>

            <div class="slider" id="mainSlider">
            </div>

            <button class="arrow right" id="nextBtn">
                &#10095;
            </button>

        </div>

    </section>

    <section class="section">

        <h2 id="cityTitle">
            Cerca de ti
        </h2>

        <div class="slider-container">

            <button class="arrow left" id="prevCityBtn">
                &#10094;
            </button>

            <div class="slider" id="citySlider">
            </div>

            <button class="arrow right" id="nextCityBtn">
                &#10095;
            </button>

        </div>

    </section>

</main>

<script src="../js/menu.js"></script>

</body>
</html>
