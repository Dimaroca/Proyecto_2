<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de caracteres para soportar acentos y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Permite que la página se adapte correctamente a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icono que aparece en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="../assets/logo.png">

    <!-- Título de la página -->
    <title>Preferencias - Throphinder</title>

    <!-- Hoja de estilos de la página de preferencias -->
    <link rel="stylesheet" href="../css/question.css">
</head>
<body>

    <header>

        <!-- Contenedor del logo o nombre de la aplicación -->
        <div class="nombre-container">
            <img src="../assets/nombre.png" alt="ThropFinder">
        </div>

        <!-- Contenedor de acciones del encabezado -->
        <div class="header-actions">

            <!-- Botón para cerrar sesión -->
            <button id="logoutBtn" class="logout-btn">
                Cerrar sesión
            </button>

        </div>

    </header>

    <main>

        <!-- Contenedor principal del formulario -->
        <div class="form-container">

            <!-- Encabezado del formulario -->
            <div class="form-header">

                <h1>
                    Personalicemos tus recomendaciones
                </h1>

                <p>
                    Responde estas preguntas para recomendarte mejores opciones
                </p>

            </div>

            <!-- Formulario de preferencias -->
            <form>

                <!-- Pregunta sobre el tipo de comida preferida -->
                <div class="question-card">

                    <h3>
                        1. ¿Qué tipo de comida prefieres?
                    </h3>

                    <!-- Lista desplegable que se llenará dinámicamente -->
                    <select id="foodSelect">

                        <option value="">
                            Selecciona un tipo de comida
                        </option>

                    </select>

                </div>

                <!-- Pregunta sobre presupuesto -->
                <div class="question-card">

                    <h3>
                        2. ¿Cuál es tu presupuesto aproximado?
                    </h3>

                    <!-- Opciones de presupuesto -->
                    <label>
                        <input type="radio" name="budget" value="bajo">
                        Bajo
                    </label>

                    <label>
                        <input type="radio" name="budget" value="medio">
                        Medio
                    </label>

                    <label>
                        <input type="radio" name="budget" value="alto">
                        Alto
                    </label>

                </div>

                <!-- Pregunta sobre calificación mínima -->
                <div class="question-card">

                    <h3>
                        3. ¿Qué calificación mínima aceptas?
                    </h3>

                    <!-- Control deslizante para seleccionar calificación -->
                    <input
                        type="range"
                        id="minRating"
                        min="1"
                        max="5"
                        step="0.5"
                        value="4">

                    <!-- Muestra visual de la calificación seleccionada -->
                    <p class="rating-display">

                        <span id="ratingStars">
                            ★★★★☆
                        </span>

                        <span id="ratingValue">
                            4.0
                        </span>

                    </p>

                </div>

                <!-- Pregunta sobre distancia máxima -->
                <div class="question-card">

                    <h3>
                        4. ¿Qué tan lejos estás dispuesto a ir?
                    </h3>

                    <!-- Opciones de distancia -->
                    <select id="distance">

                        <option value="same">
                            Solo mi ciudad
                        </option>

                        <option value="near">
                            Ciudades cercanas
                        </option>

                        <option value="any">
                            No me importa
                        </option>

                    </select>

                </div>

                <!-- Botón para enviar el formulario -->
                <button type="submit">
                    Continuar
                </button>

            </form>

        </div>

    </main>

    <!-- Archivo JavaScript encargado de la lógica de las preferencias -->
    <script src="../js/question.js"></script>

</body>
</html>
