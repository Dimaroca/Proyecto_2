<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <title>Preferencias - Throphinder</title>
    <link rel="stylesheet" href="../css/question.css">
</head>
<body>

    <header>

        <div class="nombre-container">
            <img src="../assets/nombre.png" alt="ThropFinder">
        </div>

        <div class="header-actions">

            <button id="logoutBtn" class="logout-btn">
                Cerrar sesión
            </button>

        </div>

    </header>
    <main>
        <div class="form-container">

            <div class="form-header">
                <h1>Personalicemos tus recomoendaciones</h1>
                <p>Responde estas preguntas para recomendarte mejores opciones</p>
            </div>

            <form>

                <div class="question-card">

                    <h3>
                        1. ¿Qué tipo de comida prefieres?
                    </h3>

                    <select id="foodSelect">

                        <option value="">
                            Selecciona un tipo de comida
                        </option>

                    </select>

                </div>
                <div class="question-card">
                    <h3>2. ¿Cuál es tu presupuesto aproximado?</h3>

                    <label><input type="radio" name="budget" value="bajo"> Bajo</label>
                    <label><input type="radio" name="budget" value="medio"> Medio</label>
                    <label><input type="radio" name="budget" value="alto"> Alto</label>
                </div>

                <div class="question-card">
                    <h3>3. ¿Qué calificación mínima aceptas?</h3>

                    <input
                        type="range"
                        id="minRating"
                        min="1"
                        max="5"
                        step="0.5"
                        value="4">

                    <p class="rating-display">

                        <span id="ratingStars">
                            ★★★★☆
                        </span>

                        <span id="ratingValue">
                            4.0
                        </span>

                    </p>
                </div>

                <div class="question-card">
                    <h3>4. ¿Qué tan lejos estás dispuesto a ir?</h3>

                    <select id="distance">

                        <option value="same">
                            Solo mi ciudad
                        </option>

                        <option value="near">
                            Ciudades cercanas
                        </option>

                        <option value="any">
                            No me importa
                        </option>

                    </select>
                </div>

                <button type="submit">
                    Continuar
                </button>

            </form>


        </div>
    </main>
    <script src="../js/question.js"></script>
</body>
</html>
